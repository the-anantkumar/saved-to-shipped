name: Hosted prototype

on:
  push:
    paths:
      - "hosted/**"
      - ".github/workflows/hosted.yml"
  pull_request:
    paths:
      - "hosted/**"
      - ".github/workflows/hosted.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prototype:
    name: Local Worker and SQLite capacity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hosted
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.2"
          cache: npm
          cache-dependency-path: hosted/package-lock.json
      - name: Install locked hosted tooling
        run: npm ci
      - name: Check TypeScript
        run: npm run typecheck
      - name: Test closed routes, identity primitive and SQLite behavior
        run: npm test
      - name: Measure synthetic local capacity
        run: npm run capacity
      - name: Validate deployment bundle without deploying
        run: npm run dryrun
      - name: Stage synthetic measurement report
        run: cp .local/capacity-report.json "$RUNNER_TEMP/save2ship-capacity-report.json"
      - name: Keep synthetic local measurements for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hosted-local-capacity-${{ github.sha }}
          path: ${{ runner.temp }}/save2ship-capacity-report.json
          if-no-files-found: error
          retention-days: 7
