name: Tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Install package
        run: python -m pip install .
      - name: Verify installed app outside checkout
        run: python tests/smoke_installed.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser JavaScript syntax
        run: |
          node --check saved_to_shipped/web/app.js
          node --check saved_to_shipped/web/onboarding.js
          node --check saved_to_shipped/web/theme.js
      - name: Check UI behavior
        run: node --test tests/*_behavior.mjs
