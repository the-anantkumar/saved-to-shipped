name: Bug report
description: Report a reproducible problem using synthetic or redacted examples.
body:
  - type: markdown
    attributes:
      value: "For security-sensitive issues, follow SECURITY.md. Keep real archives, private saved text, and API keys out of this report."
  - type: input
    id: version
    attributes:
      label: App version or commit
      description: Run saved-to-shipped --version or include the checkout commit.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and Python version
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include a minimal synthetic example when the input format matters.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
      description: Include a redacted error if one is shown.
    validations:
      required: true
